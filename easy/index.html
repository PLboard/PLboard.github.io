<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>피엘보드 - 아재버전</title>
  <style>
    :root {
      --ink: #111111;
      --muted: #565656;
      --line: #b8b8b8;
      --soft: #f4f4f4;
      --blue: #1559d6;
      --red: #d1263f;
      --yellow: #aa7900;
      --green: #167044;
      --team-one: #6c32c9;
      --team-two: #c95008;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--ink);
      background: #ffffff;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      font-size: 22px;
      line-height: 1.45;
      letter-spacing: 0;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 18px 20px 60px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 14px 0 12px;
      background: rgba(255, 255, 255, 0.97);
      border-bottom: 3px solid var(--ink);
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    h1,
    h2,
    p {
      margin: 0;
    }

    h1 {
      font-size: 38px;
      line-height: 1.1;
    }

    .version-label {
      color: var(--muted);
      font-size: 18px;
      font-weight: 700;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      margin-top: 12px;
    }

    .summary-item {
      min-height: 76px;
      padding: 9px 12px;
      border: 2px solid var(--ink);
      background: #ffffff;
    }

    .summary-item span {
      display: block;
      color: var(--muted);
      font-size: 17px;
      font-weight: 800;
    }

    .summary-item strong {
      display: block;
      margin-top: 2px;
      font-size: 28px;
      line-height: 1.15;
    }

    .summary-item.open {
      color: var(--green);
      border-color: var(--green);
      background: #f0fff7;
    }

    .summary-item.closed {
      color: var(--red);
      border-color: var(--red);
      background: #fff5f5;
    }

    .section {
      padding: 24px 0;
      border-bottom: 2px solid var(--ink);
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 16px;
    }

    h2 {
      font-size: 29px;
      line-height: 1.2;
    }

    .help {
      margin-top: 8px;
      color: var(--muted);
      font-size: 18px;
    }

    .settings-grid {
      display: grid;
      grid-template-columns: minmax(260px, 0.8fr) minmax(340px, 1.2fr);
      gap: 18px;
    }

    .field {
      display: grid;
      gap: 7px;
    }

    .field > label,
    .field-label {
      font-size: 19px;
      font-weight: 900;
    }

    input,
    select,
    textarea {
      width: 100%;
      min-height: 52px;
      padding: 8px 11px;
      color: var(--ink);
      background: #ffffff;
      border: 2px solid #777777;
      border-radius: 3px;
      outline: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(21, 89, 214, 0.15);
    }

    .choice-group {
      display: flex;
      gap: 6px;
    }

    .choice-btn,
    .command-btn,
    .icon-btn {
      min-height: 48px;
      padding: 7px 13px;
      border: 2px solid #777777;
      border-radius: 3px;
      color: var(--ink);
      background: #ffffff;
      font-weight: 900;
    }

    .choice-btn.active {
      color: #ffffff;
      background: var(--ink);
      border-color: var(--ink);
    }

    .command-btn.primary {
      color: #ffffff;
      background: var(--blue);
      border-color: var(--blue);
    }

    .command-btn.danger {
      color: var(--red);
      border-color: var(--red);
    }

    .winner-message {
      margin-top: 8px;
      padding: 8px 10px;
      border-left: 5px solid var(--red);
      color: var(--red);
      background: #fff5f5;
      font-size: 19px;
      font-weight: 900;
    }

    .winner-message.open {
      color: var(--green);
      border-color: var(--green);
      background: #f0fff7;
    }

    .funding-list {
      display: grid;
      gap: 7px;
      margin-top: 18px;
    }

    .recruit-lines {
      display: grid;
      gap: 8px;
    }

    .recruit-row {
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr) 52px;
      gap: 8px;
      align-items: start;
      min-height: 56px;
    }

    .race-mark {
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      color: #ffffff;
      font-size: 23px;
      font-weight: 900;
    }

    .race-mark.terran {
      background: var(--blue);
    }

    .race-mark.zerg {
      background: var(--red);
    }

    .race-mark.protoss {
      background: var(--yellow);
    }

    .recruit-add {
      width: 50px;
      height: 46px;
      min-height: 46px;
      padding: 0;
      color: #ffffff;
      background: var(--blue);
      border: 2px solid var(--blue);
      font-size: 28px;
      font-weight: 900;
    }

    .recruit-members {
      display: flex;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 8px;
      min-width: 0;
    }

    .recruit-name-field {
      position: relative;
      flex: 0 0 190px;
      width: 190px;
    }

    .recruit-name-input {
      width: 100%;
      min-height: 46px;
      padding-right: 38px;
      font-size: 20px;
      font-weight: 900;
    }

    .recruit-name-field button {
      position: absolute;
      top: 9px;
      right: 8px;
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      padding: 0;
      border: 1px solid #bbbbbb;
      background: var(--soft);
      font-size: 18px;
      line-height: 1;
    }

    .direct-teams {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 18px;
    }

    .direct-team {
      padding: 11px;
      border: 2px solid #777777;
    }

    .direct-team h3 {
      margin: 0 0 9px;
      font-size: 23px;
    }

    .direct-team.one h3 {
      color: var(--team-one);
    }

    .direct-team.two h3 {
      color: var(--team-two);
    }

    .team-inputs {
      display: grid;
      grid-template-columns: repeat(var(--slot-count, 5), minmax(0, 1fr));
      gap: 6px;
    }

    .team-slot-input {
      min-width: 0;
      min-height: 50px;
      padding-inline: 7px;
      font-size: 21px;
      font-weight: 900;
      text-align: center;
    }

    .race-text.terran {
      color: var(--blue);
    }

    .race-text.zerg {
      color: var(--red);
    }

    .race-text.protoss {
      color: var(--yellow);
    }

    .empty {
      padding: 18px 0;
      color: #777777;
      font-size: 20px;
    }

    .funding-head,
    .funding-row {
      display: grid;
      grid-template-columns: 58px minmax(100px, 145px) minmax(155px, 190px) minmax(120px, 145px) minmax(160px, 1fr) 96px;
      column-gap: 10px;
      align-items: center;
    }

    .funding-head {
      padding: 7px 0;
      color: var(--muted);
      border-bottom: 2px solid var(--ink);
      font-size: 17px;
      font-weight: 900;
    }

    .funding-row {
      min-height: 68px;
      padding: 6px 0;
      border-bottom: 1px solid #cfcfcf;
    }

    .rank {
      font-size: 26px;
      font-weight: 900;
      text-align: center;
    }

    .funding-row .player-name {
      min-width: 0;
      overflow: hidden;
      font-size: 27px;
      line-height: 1.25;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .funding-row.first {
      background: #fffbe5;
      box-shadow: inset 0 0 0 3px var(--yellow);
    }

    .funding-row.room-row {
      background: #fff0f0;
      box-shadow: inset 0 0 0 3px var(--red);
    }

    .spectator-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 3px 0 5px;
      color: var(--red);
      font-size: 18px;
      font-weight: 900;
      white-space: nowrap;
    }

    .spectator-divider::before,
    .spectator-divider::after {
      content: "";
      height: 3px;
      background: var(--red);
    }

    .spectator-divider::before {
      flex: 0 0 58px;
    }

    .spectator-divider::after {
      flex: 1;
    }

    .funding-input {
      min-height: 56px;
      padding-right: 16px;
      font-size: 30px;
      font-weight: 900;
      text-align: right;
      appearance: textfield;
    }

    .funding-input::-webkit-inner-spin-button,
    .funding-input::-webkit-outer-spin-button {
      -webkit-appearance: none;
    }

    .role {
      margin-left: 10px;
      font-size: 20px;
      font-weight: 900;
    }

    .funding-head span:nth-child(4) {
      margin-left: 10px;
    }

    .role.spectator {
      color: var(--blue);
    }

    .role.room {
      color: var(--red);
    }

    .memo-input {
      min-height: 52px;
      font-size: 20px;
    }

    .tie-controls {
      display: flex;
      gap: 4px;
      padding-right: 10px;
    }

    .tie-controls button {
      width: 38px;
      height: 44px;
      padding: 0;
      border: 2px solid #999999;
      background: #ffffff;
      font-size: 19px;
      font-weight: 900;
    }

    .tie-controls button:disabled {
      visibility: hidden;
    }

    .funding-row.tie-moved-up {
      animation: tie-moved-up 560ms ease-out;
    }

    .funding-row.tie-moved-down {
      animation: tie-moved-down 560ms ease-out;
    }

    @keyframes tie-moved-up {
      from {
        background-color: #dceeff;
        box-shadow: inset 0 0 0 3px var(--blue);
        transform: translateY(18px);
      }
      to {
        transform: translateY(0);
      }
    }

    @keyframes tie-moved-down {
      from {
        background-color: #dceeff;
        box-shadow: inset 0 0 0 3px var(--blue);
        transform: translateY(-18px);
      }
      to {
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .funding-row.tie-moved-up,
      .funding-row.tie-moved-down {
        animation-duration: 1ms;
      }
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 18px;
    }

    .links a {
      color: #0645ad;
      font-size: 19px;
      font-weight: 800;
    }

    .toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 40;
      padding: 11px 15px;
      color: #ffffff;
      background: #111111;
      font-size: 18px;
      font-weight: 800;
      opacity: 0;
      transform: translateY(12px);
      pointer-events: none;
      transition: opacity 140ms ease, transform 140ms ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 820px) {
      body {
        font-size: 20px;
      }

      .app {
        padding: 12px 12px 50px;
      }

      .topbar {
        position: static;
      }

      .summary,
      .settings-grid {
        grid-template-columns: 1fr 1fr;
      }

      .recruit-row {
        grid-template-columns: 48px minmax(0, 1fr) 52px;
      }

      .direct-teams {
        grid-template-columns: 1fr;
      }

      .funding-head {
        display: none;
      }

      .funding-row {
        grid-template-columns: 48px minmax(0, 1fr) 145px;
        padding: 10px 0;
      }

      .funding-row .role,
      .funding-row .memo-input,
      .funding-row .tie-controls {
        grid-column: 2 / -1;
      }

      .funding-row .role {
        margin-left: 0;
      }

      .funding-row .tie-controls {
        justify-content: flex-end;
        padding-right: 0;
      }
    }

    @media (max-width: 520px) {
      .title-row {
        align-items: flex-start;
        flex-direction: column;
      }

      .summary,
      .settings-grid {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 33px;
      }

      .funding-row {
        grid-template-columns: 44px minmax(0, 1fr);
      }

      .funding-row .funding-input,
      .funding-row .role,
      .funding-row .memo-input,
      .funding-row .tie-controls {
        grid-column: 2;
      }

      .team-inputs {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .recruit-name-field {
        flex-basis: calc(50% - 4px);
        width: calc(50% - 4px);
      }
    }

      border-color: var(--blue);
      outline: none;
    }

    @media (max-width: 980px) {
      .summary {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      #winnerSummary {
        font-size: 23px;
      }
    }

    @media (max-width: 820px) {
      .app {
        padding: 14px 16px 54px;
      }

      .recruit-row {
        grid-template-columns: 50px minmax(0, 1fr) 54px;
      }

      .funding-row {
        grid-template-columns: 48px minmax(0, 1fr) 155px;
      }
    }

    @media (max-width: 520px) {
      .app {
        padding-inline: 12px;
      }

      h1 {
        font-size: 35px;
      }

      .summary {
        grid-template-columns: minmax(0, 1fr);
      }

      #winnerSummary {
        font-size: 21px;
        white-space: normal;
      }

      h2 {
        font-size: 28px;
      }

      .recruit-name-field {
        flex-basis: 100%;
        width: 100%;
      }
    }

    @media (min-width: 1640px) {
      .topbar {
        position: static;
        top: auto;
      }

      body.side-summary-active .topbar {
        position: fixed;
        top: 20px;
        left: max(18px, calc((100vw - 1180px) / 2 - 224px));
        z-index: 20;
        width: 205px;
        padding: 16px 14px;
        background: #ffffff;
        border: 2px solid var(--ink);
        border-radius: 5px;
        box-shadow: 0 10px 28px rgba(16, 24, 40, 0.14);
        animation: side-summary-in 180ms ease-out;
      }

      body.side-summary-active .title-row {
        align-items: flex-start;
        flex-direction: column;
        gap: 8px;
      }

      body.side-summary-active h1 {
        font-size: 30px;
      }

      body.side-summary-active .version-label {
        padding: 4px 7px;
        font-size: 15px;
      }

      body.side-summary-active .summary {
        grid-template-columns: minmax(0, 1fr);
        gap: 7px;
        margin-top: 12px;
      }

      body.side-summary-active .summary-item {
        min-height: 68px;
        padding: 8px 10px;
      }

      body.side-summary-active .summary-item span {
        font-size: 15px;
      }

      body.side-summary-active .summary-item strong {
        margin-top: 2px;
        font-size: 25px;
      }

      body.side-summary-active .member-summary-card {
        display: none;
      }

      body.side-summary-active .winner-status-line {
        display: grid;
        gap: 3px;
      }

      body.side-summary-active #winnerSummary {
        font-size: 18px;
        white-space: normal;
      }

      body.side-summary-active .winner-remaining {
        font-size: 16px;
      }

      .funding-head {
        padding-block: 7px;
        font-size: 16px;
      }

      .funding-row {
        min-height: 64px;
        padding-block: 4px;
      }

      .rank,
      .funding-row .player-name {
        font-size: 24px;
      }

      .funding-input {
        min-height: 48px;
        font-size: 28px;
      }

      .role {
        font-size: 18px;
      }

      .memo-input {
        min-height: 46px;
        font-size: 18px;
      }

      .tie-controls button {
        width: 34px;
        height: 40px;
        font-size: 17px;
      }

      .spectator-divider {
        margin-block: 3px;
        font-size: 17px;
      }
    }

    @keyframes side-summary-in {
      from {
        opacity: 0;
        transform: translateX(-14px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .board-pet {
      position: fixed;
      right: 22px;
      bottom: 22px;
      z-index: 70;
      display: grid;
      place-items: center;
      width: 74px;
      height: 74px;
      padding: 0;
      color: #ffffff;
      background: var(--ink);
      border: 3px solid #ffffff;
      border-radius: 8px;
      box-shadow: 0 0 0 2px var(--ink), 0 10px 24px rgba(16, 24, 40, 0.2);
      cursor: grab;
      touch-action: none;
      user-select: none;
    }

    .board-pet::before,
    .board-pet::after {
      content: "";
      position: absolute;
      top: 27px;
      width: 7px;
      height: 20px;
      background: inherit;
      border: 2px solid #ffffff;
    }

    .board-pet::before {
      left: -8px;
      border-right: 0;
      border-radius: 4px 0 0 4px;
    }

    .board-pet::after {
      right: -8px;
      border-left: 0;
      border-radius: 0 4px 4px 0;
    }

    .roulette-pet {
      bottom: 112px;
      background: #493626;
    }

    .observer-pet {
      bottom: 202px;
      background: #101820;
    }

    .board-pet:active {
      cursor: grabbing;
    }

    .board-pet:focus-visible {
      outline: 4px solid rgba(23, 92, 211, 0.3);
      outline-offset: 4px;
    }

    .pet-display {
      position: relative;
      display: block;
      width: 44px;
      height: 44px;
      background: #ffffff;
      border: 3px solid #ffffff;
      border-radius: 50%;
    }

    .timer-display {
      background: #f8fafc;
      box-shadow: inset 0 0 0 2px var(--blue);
    }

    .timer-display::before,
    .timer-display::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 3px;
      background: var(--ink);
      border-radius: 3px;
      transform-origin: 50% 100%;
    }

    .timer-display::before {
      height: 13px;
      transform: translate(-50%, -100%);
    }

    .timer-display::after {
      height: 10px;
      transform: translate(-50%, -100%) rotate(120deg);
    }

    .roulette-display {
      background: conic-gradient(#f97066 0 25%, #53b1fd 0 50%, #fdb022 0 75%, #84cc16 0);
      box-shadow: inset 0 0 0 2px #493626;
    }

    .roulette-display::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 8px;
      height: 8px;
      background: #493626;
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }

    .observer-display {
      display: grid;
      place-items: center;
      background: #101820;
      border-color: #68ff4a;
      border-radius: 5px;
      box-shadow: inset 0 0 0 2px #223142;
    }

    .observer-display::before {
      content: "OBS";
      color: #68ff4a;
      font-family: Consolas, monospace;
      font-size: 12px;
      font-weight: 900;
      text-shadow: 0 0 7px rgba(104, 255, 74, 0.48);
    }

    .pet-antenna {
      position: absolute;
      top: 4px;
      left: 50%;
      width: 3px;
      height: 10px;
      background: #ffffff;
      transform: translateX(-50%);
    }

    .pet-antenna::before {
      content: "";
      position: absolute;
      top: -3px;
      left: -3px;
      width: 9px;
      height: 7px;
      background: #12b76a;
      border-radius: 3px;
    }

    .pet-label {
      position: absolute;
      left: 50%;
      bottom: 1px;
      font-size: 9px;
      font-weight: 900;
      white-space: nowrap;
      transform: translateX(-50%);
    }

    .board-pet.timer-running {
      box-shadow: 0 0 0 3px #12b76a, 0 10px 24px rgba(16, 24, 40, 0.2);
    }

    .board-pet.timer-done {
      box-shadow: 0 0 0 4px var(--red), 0 10px 24px rgba(16, 24, 40, 0.2);
    }

    .pet-tools {
      position: fixed;
      z-index: 69;
      width: min(650px, calc(100vw - 24px));
      max-height: calc(100vh - 16px);
      padding: 14px;
      color: var(--ink);
      background: #ffffff;
      border: 2px solid var(--ink);
      border-radius: 6px;
      box-shadow: 0 12px 30px rgba(16, 24, 40, 0.18);
      overflow-y: auto;
      cursor: grab;
    }

    .pet-tools[hidden] {
      display: none;
    }

    .pet-tools.dragging {
      cursor: grabbing;
      user-select: none;
    }

    .pet-tools-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: grab;
      user-select: none;
    }

    .pet-tools-head strong {
      font-size: 19px;
      font-weight: 950;
    }

    .pet-tool-pane[hidden] {
      display: none;
    }

    .pet-close,
    .pet-action {
      display: inline-grid;
      place-items: center;
      padding: 0;
      color: var(--ink);
      background: #ffffff;
      border: 2px solid var(--ink);
      border-radius: 4px;
      font-weight: 950;
    }

    .pet-close {
      width: 34px;
      height: 34px;
      font-size: 22px;
    }

    .pet-timer-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(105px, 1fr)) 200px;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
    }

    .pet-time-field {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: end;
      gap: 5px;
      min-width: 0;
    }

    .pet-time-field input {
      width: 100%;
      min-width: 0;
      min-height: 64px;
      padding: 5px 3px;
      color: #30343b;
      background: #ffffff;
      border: 2px solid #c8cdd4;
      border-radius: 4px;
      font-family: Arial, sans-serif;
      font-size: 40px;
      line-height: 1;
      font-weight: 900;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .pet-time-field span {
      padding-bottom: 10px;
      color: #344054;
      font-size: 16px;
      font-weight: 900;
      white-space: nowrap;
    }

    .pet-main-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .pet-action {
      min-height: 54px;
      font-size: 16px;
    }

    .pet-action.primary {
      color: #ffffff;
      background: #159524;
      border-color: #087315;
    }

    .pet-action.reset {
      color: #ffffff;
      background: #344054;
      border-color: #1d2939;
    }

    .pet-quick-add {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 0;
      margin: 14px -14px -14px;
      border-top: 1px solid #d0d5dd;
    }

    .pet-quick-add button {
      min-height: 44px;
      padding: 6px 4px;
      color: #475467;
      background: #f7f8fa;
      border: 0;
      border-right: 1px solid #d0d5dd;
      border-radius: 0;
      font-size: 15px;
      font-weight: 900;
    }

    .pet-quick-add button:last-child {
      border-right: 0;
    }

    .pet-quick-add button:hover,
    .pet-quick-add button:focus-visible {
      color: #ffffff;
      background: var(--blue);
      outline: none;
    }

    .roulette-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
    }

    .roulette-modes {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-top: 12px;
    }

    .roulette-modes button {
      min-height: 42px;
      padding: 7px 10px;
      color: #475467;
      background: #f2f4f7;
      border: 1px solid #98a2b3;
      border-radius: 4px;
      font-size: 17px;
      font-weight: 950;
    }

    .roulette-modes button.active {
      color: #ffffff;
      background: #493626;
      border-color: #493626;
    }

    .roulette-manual[hidden],
    .roulette-loser[hidden] {
      display: none;
    }

    .roulette-loser {
      margin-top: 10px;
      padding: 12px;
      background: #fff4f2;
      border: 2px solid #f0a39b;
      border-radius: 4px;
    }

    .roulette-loser-summary {
      color: var(--red);
      font-size: 18px;
      font-weight: 950;
    }

    .roulette-loser-list {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 9px;
    }

    .roulette-loser-chip {
      display: inline-flex;
      align-items: center;
      min-height: 38px;
      padding: 6px 10px;
      color: #7a271a;
      background: #ffffff;
      border: 1px solid #f0a39b;
      border-radius: 4px;
      font-size: 17px;
      font-weight: 950;
    }

    .roulette-controls > span {
      margin-right: 4px;
      color: #344054;
      font-size: 17px;
      font-weight: 900;
    }

    .roulette-count-btn {
      width: 38px;
      min-height: 38px;
      padding: 0;
      color: #344054;
      background: #f2f4f7;
      border: 1px solid #98a2b3;
      border-radius: 4px;
      font-size: 22px;
      font-weight: 950;
    }

    .roulette-count {
      min-width: 42px;
      font-size: 18px;
      font-weight: 950;
      text-align: center;
    }

    .roulette-limit {
      color: #667085;
      font-size: 15px;
      font-weight: 800;
    }

    .roulette-options {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 7px;
      margin-top: 10px;
    }

    .roulette-option {
      min-width: 0;
      min-height: 44px;
      padding: 6px 9px;
      border-width: 2px;
      font-size: 17px;
      font-weight: 900;
    }

    .roulette-stage {
      display: grid;
      justify-items: center;
      margin-top: 12px;
      padding: 14px;
      background: #f6f1e8;
      border: 1px solid #d8cfc2;
    }

    .roulette-wheel-box {
      position: relative;
      width: min(330px, 100%);
      padding-top: 12px;
    }

    .roulette-wheel-clip {
      width: 100%;
      aspect-ratio: 1;
      overflow: hidden;
      border-radius: 50%;
    }

    .roulette-pointer {
      position: absolute;
      top: 0;
      left: 50%;
      z-index: 2;
      width: 0;
      height: 0;
      border-right: 13px solid transparent;
      border-left: 13px solid transparent;
      border-top: 32px solid #493626;
      filter: drop-shadow(0 2px 1px rgba(0, 0, 0, 0.25));
      transform: translateX(-50%);
    }

    .roulette-wheel {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 50%;
      filter: drop-shadow(0 5px 2px rgba(73, 54, 38, 0.18));
      transform: rotate(0deg);
    }

    .roulette-result {
      min-height: 34px;
      margin-top: 8px;
      color: #493626;
      font-size: 21px;
      font-weight: 950;
      text-align: center;
    }

    .roulette-spin {
      min-width: 150px;
      min-height: 50px;
      margin-top: 8px;
      padding: 8px 18px;
      color: #ffffff;
      background: var(--ink);
      border: 2px solid var(--ink);
      border-radius: 4px;
      font-size: 19px;
      font-weight: 950;
    }

    .roulette-spin:disabled {
      opacity: 0.55;
      cursor: wait;
    }

    .observer-copy-wrap {
      margin-top: 12px;
    }

    .observer-copy-board {
      display: block;
      width: 100%;
      min-height: 58px;
      height: 58px;
      padding: 10px 12px;
      overflow: hidden;
      color: #68ff4a;
      background: #101820;
      border: 2px solid #223142;
      border-radius: 4px;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.04);
      font-family: Consolas, "Liberation Mono", monospace;
      font-size: 20px;
      line-height: 34px;
      text-shadow: 0 0 9px rgba(104, 255, 74, 0.34);
      white-space: nowrap;
      resize: none;
    }

    .observer-copy-board::selection {
      color: #d6ffd0;
      background: rgba(104, 255, 74, 0.22);
    }

    .observer-copy-btn {
      width: 100%;
      min-height: 50px;
      margin-top: 9px;
      padding: 8px 14px;
      color: #ffffff;
      background: var(--blue);
      border: 2px solid #134aaf;
      border-radius: 4px;
      font-size: 18px;
      font-weight: 900;
    }

    @media (max-width: 720px) {
      .pet-timer-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .pet-time-field {
        grid-template-columns: minmax(0, 1fr);
        gap: 3px;
      }

      .pet-time-field span {
        padding: 0;
        text-align: center;
      }

      .pet-main-actions {
        grid-column: 1 / -1;
      }

      .pet-quick-add {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .pet-quick-add button:nth-child(3) {
        border-right: 0;
      }

      .pet-quick-add button:nth-child(-n + 3) {
        border-bottom: 1px solid #d0d5dd;
      }

      .roulette-options {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 520px) {
      .board-pet {
        right: 14px;
        bottom: 14px;
        width: 68px;
        height: 68px;
      }

      .roulette-pet {
        bottom: 98px;
      }

      .observer-pet {
        bottom: 182px;
      }

      .pet-time-field input {
        min-height: 56px;
        font-size: 32px;
      }
    }

    body,
    body * {
      font-weight: 900 !important;
    }

  </style>
</head>
<body>
  <main class="app">
    <div class="topbar-slot" id="topbarSlot">
      <header class="topbar" id="topbar">
        <div class="title-row">
          <h1>피엘보드</h1>
          <span class="version-label">아재버전</span>
        </div>
        <div class="summary">
          <div class="summary-item">
            <span>총 펀딩</span>
            <strong id="totalFunding">0개</strong>
          </div>
          <div class="summary-item">
            <span>매치</span>
            <strong id="matchSummary">5대5</strong>
          </div>
          <div class="summary-item member-summary-card">
            <span>멤버</span>
            <strong id="memberSummary">0명</strong>
          </div>
          <div class="summary-item closed" id="winnerSummaryCard">
            <span>위너스</span>
            <div class="winner-status-line">
              <strong id="winnerSummary">닫힘</strong>
              <small class="winner-remaining" id="winnerRemaining">목표 미설정</small>
            </div>
          </div>
        </div>
      </header>
    </div>

    <section class="section">
      <div class="section-title">
        <h2>기본 설정</h2>
        <button class="command-btn danger" id="resetBtn" type="button">전체 초기화</button>
      </div>
      <div class="settings-grid">
        <div class="field">
          <span class="field-label">매치 방식</span>
          <div class="choice-group">
            <button class="choice-btn" type="button" data-match="4">4대4</button>
            <button class="choice-btn" type="button" data-match="5">5대5</button>
          </div>
        </div>
        <div class="field">
          <label for="winnerTarget">위너스리그 목표 개수</label>
          <input id="winnerTarget" type="number" min="0" step="100" inputmode="numeric" placeholder="예: 13000">
          <p class="winner-message" id="winnerMessage">목표 개수를 입력해 주세요.</p>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="section-title">
        <h2>멤버 모집</h2>
      </div>
      <div class="recruit-lines">
        <div class="recruit-row" data-recruit-race="T">
          <span class="race-mark terran">T</span>
          <div class="recruit-members" data-recruit-list="T"></div>
          <button class="recruit-add" type="button" data-recruit-add aria-label="테란 입력칸 추가">+</button>
        </div>
        <div class="recruit-row" data-recruit-race="Z">
          <span class="race-mark zerg">Z</span>
          <div class="recruit-members" data-recruit-list="Z"></div>
          <button class="recruit-add" type="button" data-recruit-add aria-label="저그 입력칸 추가">+</button>
        </div>
        <div class="recruit-row" data-recruit-race="P">
          <span class="race-mark protoss">P</span>
          <div class="recruit-members" data-recruit-list="P"></div>
          <button class="recruit-add" type="button" data-recruit-add aria-label="토스 입력칸 추가">+</button>
        </div>
      </div>
      <div class="direct-teams">
        <div class="direct-team one">
          <h3 id="teamOneTitle">1팀 직접 입력</h3>
          <div class="team-inputs" id="teamOneInputs"></div>
        </div>
        <div class="direct-team two">
          <h3 id="teamTwoTitle">2팀 직접 입력</h3>
          <div class="team-inputs" id="teamTwoInputs"></div>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="section-title">
        <h2>펀딩 순위</h2>
      </div>
      <p class="help">펀딩 개수를 입력하고 엔터를 누르거나 다른 곳을 누르면 높은 순서로 정렬됩니다.</p>
      <div class="funding-head" aria-hidden="true">
        <span>순위</span><span>이름</span><span>펀딩 개수</span><span>역할</span><span>메모</span><span>동점</span>
      </div>
      <div class="funding-list" id="fundingList"></div>
    </section>

    <section class="section">
      <div class="section-title"><h2>참고 사이트</h2></div>
      <div class="links">
        <a href="https://eloboard.com/" target="_blank" rel="noopener noreferrer">Elo Board</a>
        <a href="https://lazygyu.github.io/roulette/" target="_blank" rel="noopener noreferrer">핀볼</a>
        <a href="https://search.naver.com/search.naver?query=%EB%84%A4%EC%9D%B4%EB%B2%84+%EC%82%AC%EB%8B%A4%EB%A6%AC" target="_blank" rel="noopener noreferrer">네이버 사다리</a>
        <a href="https://search.naver.com/search.naver?query=%EB%84%A4%EC%9D%B4%EB%B2%84+%EB%A3%B0%EB%A0%9B" target="_blank" rel="noopener noreferrer">네이버 룰렛</a>

  <button class="board-pet timer-pet" id="timerPet" type="button" data-pet-id="timer" data-pet-tool="timer" aria-label="타이머 펫 열기" title="타이머 · 드래그해서 이동">
