  <button class="board-pet roulette-pet" id="roulettePet" type="button" data-pet-id="roulette" data-pet-tool="roulette" aria-label="룰렛 펫 열기" title="룰렛 · 드래그해서 이동">
    <span class="pet-antenna" aria-hidden="true"></span>
    <span class="pet-display roulette-display" aria-hidden="true"></span>
    <span class="pet-label" aria-hidden="true">룰렛</span>
  </button>

  <button class="board-pet observer-pet" id="observerPet" type="button" data-pet-id="observer" data-pet-tool="observer" aria-label="옵저버 복사 펫 열기" title="옵저버 순서 복사 · 드래그해서 이동">
    <span class="pet-antenna" aria-hidden="true"></span>
    <span class="pet-display observer-display" aria-hidden="true"></span>
    <span class="pet-label" aria-hidden="true">복사</span>
  </button>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const STORAGE_KEY = "pl-board-state-v2";
    const races = {
      T: { label: "테란", className: "terran" },
      Z: { label: "저그", className: "zerg" },
      P: { label: "토스", className: "protoss" },
      U: { label: "미정", className: "unknown" }
    };

    let state = loadState();
    let toastTimer = 0;
    let petDrag = null;
    let petToolsDrag = null;
    let petToolsDetached = false;
    let activePet = null;
    let petTimerRemaining = 0;
    let petTimerEnd = 0;
    let petTimerInterval = 0;
    let rouletteOptionCount = 6;
    let rouletteMode = "manual";
    let rouletteRotation = 0;
    let rouletteSpinning = false;
    let rouletteFinishTimer = 0;
    const rouletteColors = ["#f97066", "#53b1fd", "#fdb022", "#84cc16", "#9b8afb", "#f79009", "#06aed4", "#ee46bc"];
    const recruitDraftSlots = { T: 1, Z: 1, P: 1 };

    const els = {
      totalFunding: document.getElementById("totalFunding"),
      matchSummary: document.getElementById("matchSummary"),
      memberSummary: document.getElementById("memberSummary"),
      winnerSummaryCard: document.getElementById("winnerSummaryCard"),
      winnerSummary: document.getElementById("winnerSummary"),
      winnerRemaining: document.getElementById("winnerRemaining"),
      winnerTarget: document.getElementById("winnerTarget"),
      winnerMessage: document.getElementById("winnerMessage"),
      topbar: document.getElementById("topbar"),
      topbarSlot: document.getElementById("topbarSlot"),
      matchButtons: Array.from(document.querySelectorAll("[data-match]")),
      recruitRows: Array.from(document.querySelectorAll("[data-recruit-race]")),
      recruitAddButtons: Array.from(document.querySelectorAll("[data-recruit-add]")),
      recruitLists: Array.from(document.querySelectorAll("[data-recruit-list]")),
      teamOneTitle: document.getElementById("teamOneTitle"),
      teamTwoTitle: document.getElementById("teamTwoTitle"),
      teamOneInputs: document.getElementById("teamOneInputs"),
      teamTwoInputs: document.getElementById("teamTwoInputs"),
      fundingList: document.getElementById("fundingList"),
      resetBtn: document.getElementById("resetBtn"),
      timerPet: document.getElementById("timerPet"),
      roulettePet: document.getElementById("roulettePet"),
      observerPet: document.getElementById("observerPet"),
      boardPets: Array.from(document.querySelectorAll(".board-pet")),
      petTools: document.getElementById("petTools"),
      petClose: document.getElementById("petClose"),
      petToolTitle: document.getElementById("petToolTitle"),
      petTimerPane: document.getElementById("petTimerPane"),
      petRoulettePane: document.getElementById("petRoulettePane"),
      petObserverPane: document.getElementById("petObserverPane"),
      petTimerHours: document.getElementById("petTimerHours"),
      petTimerMinutes: document.getElementById("petTimerMinutes"),
      petTimerSeconds: document.getElementById("petTimerSeconds"),
      petTimerToggle: document.getElementById("petTimerToggle"),
      petTimerReset: document.getElementById("petTimerReset"),
      petTimeInputs: Array.from(document.querySelectorAll(".pet-time-field input")),
      petAddButtons: Array.from(document.querySelectorAll("[data-pet-add]")),
      rouletteMinus: document.getElementById("rouletteMinus"),
      roulettePlus: document.getElementById("roulettePlus"),
      rouletteCount: document.getElementById("rouletteCount"),
      rouletteModeButtons: Array.from(document.querySelectorAll("[data-roulette-mode]")),
      rouletteManual: document.getElementById("rouletteManual"),
      rouletteLoser: document.getElementById("rouletteLoser"),
      rouletteLoserSummary: document.getElementById("rouletteLoserSummary"),
      rouletteLoserList: document.getElementById("rouletteLoserList"),
      rouletteOptions: document.getElementById("rouletteOptions"),
      rouletteWheel: document.getElementById("rouletteWheel"),
      rouletteResult: document.getElementById("rouletteResult"),
      rouletteSpin: document.getElementById("rouletteSpin"),
      observerCopyText: document.getElementById("observerCopyText"),
      observerCopyBtn: document.getElementById("observerCopyBtn"),
      toast: document.getElementById("toast")
    };

    bindEvents();
    render();

    function createDefaultState() {
      return {
        version: 3,
        title: "",
        matchSize: 5,
        winnersTarget: 0,
        focusMode: false,
        winnersCollapsed: false,
        settingsCollapsed: false,
        teamCollapsed: false,
        players: []
      };
    }

    function loadState() {
      const fallback = createDefaultState();
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (!saved) return fallback;
        return {
          ...fallback,
          ...saved,
          matchSize: saved.matchSize === 4 ? 4 : 5,
          winnersTarget: numberValue(saved.winnersTarget),
          players: Array.isArray(saved.players)
            ? saved.players.map(normalizePlayer).filter((player) => player.name)
            : []
        };
      } catch {
        return fallback;
      }
    }

    function normalizePlayer(player) {
      return {
        id: String(player.id || createId()),
        name: String(player.name || "").trim().slice(0, 10),
        race: races[player.race] ? player.race : "U",
        team: player.team === "1" || player.team === "2" ? player.team : "",
        memo: String(player.memo || "").slice(0, 30),
        funding: numberValue(player.funding),
        fundingOrder: orderValue(player.fundingOrder),
        teamOrder: orderValue(player.teamOrder),
        roleOrder: orderValue(player.roleOrder)
      };
    }

    function save() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch {
        // The page still works for the current session when browser storage is unavailable.
      }
    }

    function bindEvents() {
      els.matchButtons.forEach((button) => {
        button.addEventListener("click", () => {
          state.matchSize = Number(button.dataset.match);
          saveAndRender();
        });
      });

      els.winnerTarget.addEventListener("input", () => {
        state.winnersTarget = numberValue(els.winnerTarget.value);
        saveAndRender();
      });

      els.recruitAddButtons.forEach((button) => button.addEventListener("click", addRecruitSlot));
      els.resetBtn.addEventListener("click", resetBoard);
      window.addEventListener("scroll", syncSideSummary, { passive: true });
      window.addEventListener("resize", syncSideSummary);
      window.addEventListener("resize", clampPetToViewport);
      els.boardPets.forEach((pet) => {
        pet.addEventListener("pointerdown", startPetDrag);
        pet.addEventListener("pointermove", movePet);
        pet.addEventListener("pointerup", endPetDrag);
        pet.addEventListener("pointercancel", cancelPetDrag);
        pet.addEventListener("click", handlePetKeyboardClick);
      });
      els.petClose.addEventListener("click", closePetTools);
      els.petTools.addEventListener("pointerdown", startPetToolsDrag);
      els.petTools.addEventListener("pointermove", movePetTools);
      els.petTools.addEventListener("pointerup", endPetToolsDrag);
      els.petTools.addEventListener("pointercancel", cancelPetToolsDrag);
      els.petTimerToggle.addEventListener("click", togglePetTimer);
      els.petTimerReset.addEventListener("click", resetPetTimer);
      els.petTimeInputs.forEach((input) => input.addEventListener("change", syncPetTimerInputs));
      els.petAddButtons.forEach((button) => button.addEventListener("click", addPetTimerTime));
      els.rouletteMinus.addEventListener("click", () => changeRouletteCount(-1));
      els.roulettePlus.addEventListener("click", () => changeRouletteCount(1));
      els.rouletteModeButtons.forEach((button) => button.addEventListener("click", switchRouletteMode));
      els.rouletteSpin.addEventListener("click", spinRoulette);
      els.observerCopyBtn.addEventListener("click", copyObserverOrder);
      syncSideSummary();
      restorePetPositions();
      renderPetTimer();
      renderRouletteOptions();
    }

    function handlePetKeyboardClick(event) {
      if (event.detail === 0) openPetTool(event.currentTarget);
    }

    function startPetDrag(event) {
      if (event.button !== 0) return;
      event.preventDefault();
      const pet = event.currentTarget;
      const rect = pet.getBoundingClientRect();
      petDrag = {
        pet,
        pointerId: event.pointerId,
        startX: event.clientX,
        startY: event.clientY,
        left: rect.left,
        top: rect.top,
        moved: false
      };
      pet.style.left = `${rect.left}px`;
      pet.style.top = `${rect.top}px`;
      pet.style.right = "auto";
      pet.style.bottom = "auto";
      pet.setPointerCapture(event.pointerId);
    }

    function movePet(event) {
      if (!petDrag || event.pointerId !== petDrag.pointerId) return;
      const deltaX = event.clientX - petDrag.startX;
      const deltaY = event.clientY - petDrag.startY;
      if (Math.hypot(deltaX, deltaY) > 5) petDrag.moved = true;
      const pet = petDrag.pet;
      const rect = pet.getBoundingClientRect();
      const left = clamp(petDrag.left + deltaX, 8, window.innerWidth - rect.width - 8);
      const top = clamp(petDrag.top + deltaY, 8, window.innerHeight - rect.height - 8);
      pet.style.left = `${left}px`;
      pet.style.top = `${top}px`;
      if (!els.petTools.hidden && activePet === pet && !petToolsDetached) positionPetTools();
    }

    function endPetDrag(event) {
      if (!petDrag || event.pointerId !== petDrag.pointerId) return;
      const pet = petDrag.pet;
      const moved = petDrag.moved;
      pet.releasePointerCapture(event.pointerId);
      petDrag = null;
      separateOverlappingPets(pet);
      savePetPosition(pet);
      if (!moved) openPetTool(pet);
    }

    function cancelPetDrag(event) {
      if (!petDrag || event.pointerId !== petDrag.pointerId) return;
      petDrag = null;
    }

    function startPetToolsDrag(event) {
      if (event.button !== 0) return;
      if (event.target.closest("button, input, label, a, textarea, select")) return;
      if (event.pointerType === "touch" && !event.target.closest(".pet-tools-head")) return;
      event.preventDefault();
      const rect = els.petTools.getBoundingClientRect();
      petToolsDrag = {
        pointerId: event.pointerId,
        startX: event.clientX,
        startY: event.clientY,
        left: rect.left,
        top: rect.top
      };
      els.petTools.style.left = `${rect.left}px`;
      els.petTools.style.top = `${rect.top}px`;
      els.petTools.setPointerCapture(event.pointerId);
      els.petTools.classList.add("dragging");
      petToolsDetached = true;
    }

    function movePetTools(event) {
      if (!petToolsDrag || event.pointerId !== petToolsDrag.pointerId) return;
      const rect = els.petTools.getBoundingClientRect();
      const left = clamp(petToolsDrag.left + event.clientX - petToolsDrag.startX, 8, window.innerWidth - rect.width - 8);
      const top = clamp(petToolsDrag.top + event.clientY - petToolsDrag.startY, 8, window.innerHeight - rect.height - 8);
      els.petTools.style.left = `${left}px`;
      els.petTools.style.top = `${top}px`;
    }

    function endPetToolsDrag(event) {
      if (!petToolsDrag || event.pointerId !== petToolsDrag.pointerId) return;
      els.petTools.releasePointerCapture(event.pointerId);
      petToolsDrag = null;
      els.petTools.classList.remove("dragging");
      savePetToolsPosition();
    }

    function cancelPetToolsDrag(event) {
      if (!petToolsDrag || event.pointerId !== petToolsDrag.pointerId) return;
      petToolsDrag = null;
      els.petTools.classList.remove("dragging");
    }

    function clampPet(value, fallback) {
      const number = Number(value);
      return Number.isFinite(number) ? number : fallback;
    }

    function clamp(value, minimum, maximum) {
      return Math.min(Math.max(value, minimum), Math.max(minimum, maximum));
    }

    function restorePetPositions() {
      els.boardPets.forEach((pet) => {
        try {
          const saved = localStorage.getItem(`pl-board-pet-position-v2-${pet.dataset.petId}`);
          const legacy = pet.dataset.petId === "timer" ? localStorage.getItem("pl-board-pet-position-v1") : null;
          const position = JSON.parse(saved || legacy);
          if (!position) return;
          pet.style.left = `${clampPet(position.left, 8)}px`;
          pet.style.top = `${clampPet(position.top, 8)}px`;
          pet.style.right = "auto";
          pet.style.bottom = "auto";
        } catch {
          // Keep the default position for this pet when storage is unavailable.
        }
      });
      requestAnimationFrame(clampPetToViewport);
    }

    function savePetPosition(pet) {
      try {
        const rect = pet.getBoundingClientRect();
        localStorage.setItem(`pl-board-pet-position-v2-${pet.dataset.petId}`, JSON.stringify({ left: rect.left, top: rect.top }));
      } catch {
        // Position persistence is optional.
      }
    }

    function clampPetToViewport() {
      els.boardPets.forEach((pet) => {
        if (!pet.style.left) return;
        const rect = pet.getBoundingClientRect();
        pet.style.left = `${clamp(rect.left, 8, window.innerWidth - rect.width - 8)}px`;
        pet.style.top = `${clamp(rect.top, 8, window.innerHeight - rect.height - 8)}px`;
      });
      els.boardPets.slice(1).forEach(separateOverlappingPets);
      if (!els.petTools.hidden) positionPetTools();
    }

    function separateOverlappingPets(movedPet) {
      const gap = 16;
      els.boardPets.filter((pet) => pet !== movedPet).forEach((otherPet) => {
        const movedRect = movedPet.getBoundingClientRect();
        const otherRect = otherPet.getBoundingClientRect();
        const overlap = !(
          movedRect.right < otherRect.left ||
          movedRect.left > otherRect.right ||
          movedRect.bottom < otherRect.top ||
          movedRect.top > otherRect.bottom
        );
        if (!overlap) return;

        const maximumTop = window.innerHeight - movedRect.height - 8;
        const above = otherRect.top - movedRect.height - gap;
        const below = otherRect.bottom + gap;
        const preferredTop = above >= 8 ? above : below <= maximumTop ? below : 8;
        movedPet.style.left = `${clamp(movedRect.left, 8, window.innerWidth - movedRect.width - 8)}px`;
        movedPet.style.top = `${clamp(preferredTop, 8, maximumTop)}px`;
        movedPet.style.right = "auto";
        movedPet.style.bottom = "auto";
      });
    }

    function openPetTool(pet) {
      if (!els.petTools.hidden && activePet === pet) {
        closePetTools();
        return;
      }
      activePet = pet;
      els.petTools.hidden = false;
      els.boardPets.forEach((item) => item.setAttribute("aria-expanded", item === pet ? "true" : "false"));
      setPetTool(pet.dataset.petTool);
      petToolsDetached = restorePetToolsPosition(pet.dataset.petTool);
      requestAnimationFrame(positionPetTools);
    }

    function closePetTools() {
      els.petTools.hidden = true;
      els.boardPets.forEach((pet) => pet.setAttribute("aria-expanded", "false"));
      activePet = null;
    }

    function positionPetTools() {
      if (!activePet) return;
      const panelRect = els.petTools.getBoundingClientRect();
      if (petToolsDetached) {
        els.petTools.style.left = `${clamp(panelRect.left, 8, window.innerWidth - panelRect.width - 8)}px`;
        els.petTools.style.top = `${clamp(panelRect.top, 8, window.innerHeight - panelRect.height - 8)}px`;
        return;
      }
      const petRect = activePet.getBoundingClientRect();
      const placeLeft = petRect.left > window.innerWidth / 2;
      const left = placeLeft ? petRect.left - panelRect.width - 12 : petRect.right + 12;
      const top = clamp(petRect.top, 8, window.innerHeight - panelRect.height - 8);
      els.petTools.style.left = `${clamp(left, 8, window.innerWidth - panelRect.width - 8)}px`;
      els.petTools.style.top = `${top}px`;
    }

    function restorePetToolsPosition(tool) {
      try {
        const position = JSON.parse(localStorage.getItem(`pl-board-tool-position-v1-${tool}`));
        if (!position) return false;
        els.petTools.style.left = `${clampPet(position.left, 8)}px`;
        els.petTools.style.top = `${clampPet(position.top, 8)}px`;
        return true;
      } catch {
        return false;
      }
    }

    function savePetToolsPosition() {
      if (!activePet) return;
      try {
        const rect = els.petTools.getBoundingClientRect();
        localStorage.setItem(`pl-board-tool-position-v1-${activePet.dataset.petTool}`, JSON.stringify({ left: rect.left, top: rect.top }));
      } catch {
        // Tool window positioning remains available for the current session.
      }
    }

    function setPetTool(tool) {
      const timerActive = tool === "timer";
      const rouletteActive = tool === "roulette";
      const observerActive = tool === "observer";
      els.petTimerPane.hidden = !timerActive;
      els.petRoulettePane.hidden = !rouletteActive;
      els.petObserverPane.hidden = !observerActive;
      els.petToolTitle.textContent = rouletteActive ? "원판돌리기" : observerActive ? "옵저버 순서" : "타이머";
      if (rouletteActive) {
        renderLoserRoulette();
        drawRoulette();
      }
      if (observerActive) renderObserverCopy();
    }

    function switchRouletteMode(event) {
      if (rouletteSpinning) return;
      rouletteMode = event.currentTarget.dataset.rouletteMode;
      const loserMode = rouletteMode === "loser";
      els.rouletteManual.hidden = loserMode;
      els.rouletteLoser.hidden = !loserMode;
      els.rouletteModeButtons.forEach((button) => button.classList.toggle("active", button === event.currentTarget));
      rouletteRotation = 0;
      els.rouletteWheel.style.transition = "none";
      els.rouletteWheel.style.transform = "rotate(0deg)";
      if (loserMode) {
        renderLoserRoulette();
      } else {
        els.rouletteResult.textContent = "돌리기 버튼을 눌러주세요.";
        els.rouletteSpin.textContent = "원판 돌리기";
        setRouletteControlsDisabled(false);
      }
      drawRoulette();
      requestAnimationFrame(positionPetTools);
    }

    function loserRouletteCandidates() {
      if (!state.players.length) return [];
      const minimumFunding = Math.min(...state.players.map((player) => player.funding));
      return state.players.filter((player) => player.funding === minimumFunding);
    }

    function activeRouletteEntries() {
      if (rouletteMode === "loser") {
        return loserRouletteCandidates().map((player) => ({ id: player.id, name: player.name }));
      }
      return rouletteOptionValues().map((name) => ({ id: "", name }));
    }

    function renderLoserRoulette() {
      if (rouletteMode !== "loser" || rouletteSpinning) return;
      const candidates = loserRouletteCandidates();
      els.rouletteLoserList.replaceChildren();
      candidates.forEach((player) => {
        const chip = document.createElement("span");
        chip.className = "roulette-loser-chip";
        chip.textContent = player.name;
        els.rouletteLoserList.appendChild(chip);
      });

      if (!candidates.length) {
        els.rouletteLoserSummary.textContent = "펀딩 명단이 없습니다.";
        els.rouletteResult.textContent = "선수를 먼저 등록해 주세요.";
        els.rouletteSpin.textContent = "꼴찌 룰렛 돌리기";
      } else {
        const minimumFunding = candidates[0].funding;
        els.rouletteLoserSummary.textContent = `최저 ${formatCount(minimumFunding)} · 동점 ${candidates.length}명`;
        els.rouletteResult.textContent = candidates.length === 1
          ? `${candidates[0].name} 선수가 단독 룸싸개입니다.`
          : "최저 펀딩 동점자 중 룸싸개를 정합니다.";
        els.rouletteSpin.textContent = candidates.length === 1 ? "동점자 없음" : "꼴찌 룰렛 돌리기";
      }
      setRouletteControlsDisabled(candidates.length < 2);
      drawRoulette();
    }

    function rouletteRawOptionValues() {
      return Array.from(els.rouletteOptions.querySelectorAll("input"), (input) => input.value);
    }

    function rouletteOptionValues() {
      const current = rouletteRawOptionValues();
      return Array.from({ length: rouletteOptionCount }, (_, index) => current[index]?.trim() || `옵션${index + 1}`);
    }

    function renderRouletteOptions(values = rouletteRawOptionValues()) {
      els.rouletteOptions.replaceChildren();
      for (let index = 0; index < rouletteOptionCount; index += 1) {
        const input = document.createElement("input");
        input.className = "roulette-option";
        input.type = "text";
        input.maxLength = 12;
        input.value = values[index] || "";
        input.placeholder = `옵션${index + 1}`;
        input.setAttribute("aria-label", `원판 옵션 ${index + 1}`);
        input.style.borderLeftColor = rouletteColors[index];
        input.addEventListener("input", drawRoulette);
        els.rouletteOptions.appendChild(input);
      }
      els.rouletteCount.textContent = `${rouletteOptionCount}개`;
      els.rouletteMinus.disabled = rouletteOptionCount <= 2;
      els.roulettePlus.disabled = rouletteOptionCount >= 8;
      drawRoulette();
    }

    function changeRouletteCount(change) {
      if (rouletteSpinning) return;
      const values = rouletteRawOptionValues();
      rouletteOptionCount = clamp(rouletteOptionCount + change, 2, 8);
      rouletteRotation = 0;
      els.rouletteWheel.style.transition = "none";
      els.rouletteWheel.style.transform = "rotate(0deg)";
      els.rouletteResult.textContent = "돌리기 버튼을 눌러주세요.";
      renderRouletteOptions(values);
      requestAnimationFrame(positionPetTools);
    }

    function drawRoulette() {
      const context = els.rouletteWheel.getContext("2d");
      const size = els.rouletteWheel.width;
      const center = size / 2;
      const radius = center - 24;
      const entries = activeRouletteEntries();
      context.clearRect(0, 0, size, size);

      if (!entries.length) {
        context.beginPath();
        context.arc(center, center, radius, 0, Math.PI * 2);
        context.fillStyle = "#e4e7ec";
        context.fill();
        context.strokeStyle = "#667085";
        context.lineWidth = 9;
        context.stroke();
        context.fillStyle = "#475467";
        context.font = "900 34px Malgun Gothic, sans-serif";
        context.textAlign = "center";
        context.textBaseline = "middle";
        context.fillText("명단 없음", center, center);
        return;
      }

      const arc = Math.PI * 2 / entries.length;

      entries.forEach((entry, index) => {
        const start = -Math.PI / 2 + index * arc;
        const end = start + arc;
        context.beginPath();
        context.moveTo(center, center);
        context.arc(center, center, radius, start, end);
        context.closePath();
        context.fillStyle = rouletteColors[index % rouletteColors.length];
        context.fill();
        context.strokeStyle = "rgba(73, 54, 38, 0.45)";
        context.lineWidth = 2;
        context.stroke();

        const angle = start + arc / 2;
        const textRadius = entries.length === 1 ? 0 : radius * 0.62;
        const x = center + Math.cos(angle) * textRadius;
        const y = center + Math.sin(angle) * textRadius;
        const label = String(entry.name || `옵션${index + 1}`).slice(0, 10);
        context.font = "900 30px Malgun Gothic, sans-serif";
        context.textAlign = "center";
        context.textBaseline = "middle";
        const boxWidth = Math.min(180, Math.max(82, context.measureText(label).width + 28));
        context.fillStyle = "rgba(255, 255, 255, 0.9)";
        context.fillRect(x - boxWidth / 2, y - 25, boxWidth, 50);
        context.strokeStyle = "rgba(73, 54, 38, 0.28)";
        context.lineWidth = 2;
        context.strokeRect(x - boxWidth / 2, y - 25, boxWidth, 50);
        context.fillStyle = "#493626";
        context.fillText(label, x, y + 1, boxWidth - 16);
      });

      context.beginPath();
      context.arc(center, center, radius, 0, Math.PI * 2);
      context.strokeStyle = "#493626";
      context.lineWidth = 9;
      context.stroke();
      context.beginPath();
      context.arc(center, center, 14, 0, Math.PI * 2);
      context.fillStyle = "#493626";
      context.fill();
    }

    function spinRoulette() {
      if (rouletteSpinning) return;
      const entries = activeRouletteEntries();
      if (rouletteMode === "loser" && entries.length < 2) {
        toast(entries.length ? "꼴찌 동점자가 없습니다." : "펀딩 명단이 없습니다.");
        return;
      }
      if (!entries.length) return;
      const randomIndex = secureRouletteIndex(entries.length);
      const segmentDegrees = 360 / entries.length;
      const desiredRotation = (360 - (randomIndex + 0.5) * segmentDegrees + 360) % 360;
      const currentRotation = ((rouletteRotation % 360) + 360) % 360;
      const adjustment = (desiredRotation - currentRotation + 360) % 360;
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const duration = reducedMotion ? 80 : 4000;
      rouletteRotation += (reducedMotion ? 0 : 5 * 360) + adjustment;
      rouletteSpinning = true;
      setRouletteControlsDisabled(true);
      els.rouletteResult.textContent = "돌리는 중...";
      els.rouletteWheel.style.transition = `transform ${duration}ms cubic-bezier(0.15, 0.72, 0.15, 1)`;
      requestAnimationFrame(() => {
        els.rouletteWheel.style.transform = `rotate(${rouletteRotation}deg)`;
      });
      window.clearTimeout(rouletteFinishTimer);
      rouletteFinishTimer = window.setTimeout(() => {
        rouletteSpinning = false;
        setRouletteControlsDisabled(false);
        const selected = entries[randomIndex];
        if (rouletteMode === "loser") {
          assignRoomMaker(selected.id);
          els.rouletteResult.textContent = `룸싸개: ${selected.name}`;
          els.rouletteSpin.textContent = "다시 돌리기";
        } else {
          els.rouletteResult.textContent = `결과: ${selected.name}`;
        }
      }, duration + 80);
    }

    function assignRoomMaker(playerId) {
      const selected = findPlayer(playerId);
      if (!selected) return;
      const tied = rankedPlayers().filter((player) => player.funding === selected.funding && player.id !== selected.id);
      tied.push(selected);
      tied.forEach((player, index) => {
        player.roleOrder = index + 1;
      });
      save();
      render();
      toast(`${selected.name} 선수를 룸싸개로 지정했습니다.`);
    }

    function secureRouletteIndex(count) {
      if (!window.crypto?.getRandomValues) return Math.floor(Math.random() * count);
      const value = new Uint32Array(1);
      window.crypto.getRandomValues(value);
      return Math.floor(value[0] / 4294967296 * count);
    }

    function setRouletteControlsDisabled(disabled) {
      const loserCandidates = rouletteMode === "loser" ? loserRouletteCandidates() : [];
      els.rouletteSpin.disabled = disabled || (rouletteMode === "loser" && loserCandidates.length < 2);
      els.rouletteMinus.disabled = disabled || rouletteOptionCount <= 2;
      els.roulettePlus.disabled = disabled || rouletteOptionCount >= 8;
      els.rouletteModeButtons.forEach((button) => button.disabled = rouletteSpinning);
      els.rouletteOptions.querySelectorAll("input").forEach((input) => input.disabled = disabled);
    }

    function syncPetTimerInputs() {
      if (petTimerInterval) stopPetTimer();
      const hours = clamp(numberValue(els.petTimerHours.value), 0, 99);
      const minutes = clamp(numberValue(els.petTimerMinutes.value), 0, 59);
      const seconds = clamp(numberValue(els.petTimerSeconds.value), 0, 59);
      petTimerRemaining = hours * 3600 + minutes * 60 + seconds;
      els.timerPet.classList.remove("timer-done");
      renderPetTimer();
    }

    function addPetTimerTime(event) {
      const amount = numberValue(event.currentTarget.dataset.petAdd);
      if (petTimerInterval) {
        petTimerEnd += amount * 1000;
        petTimerRemaining = Math.max(0, Math.ceil((petTimerEnd - Date.now()) / 1000));
      } else {
        syncPetTimerInputs();
        petTimerRemaining = Math.min(359999, petTimerRemaining + amount);
      }
      els.timerPet.classList.remove("timer-done");
      renderPetTimer();
    }

    function togglePetTimer() {
      if (petTimerInterval) {
        petTimerRemaining = Math.max(0, Math.ceil((petTimerEnd - Date.now()) / 1000));
        stopPetTimer();
        renderPetTimer();
        return;
      }
      syncPetTimerInputs();
      if (petTimerRemaining <= 0) {
        toast("타이머 시간을 설정해 주세요.");
        return;
      }
      petTimerEnd = Date.now() + petTimerRemaining * 1000;
      els.timerPet.classList.remove("timer-done");
      els.timerPet.classList.add("timer-running");
      els.petTimeInputs.forEach((input) => input.disabled = true);
      els.petTimerToggle.textContent = "PAUSE";
      els.petTimerToggle.setAttribute("aria-label", "타이머 일시정지");
      els.petTimerToggle.title = "일시정지";
      petTimerInterval = window.setInterval(tickPetTimer, 250);
    }

    function tickPetTimer() {
      petTimerRemaining = Math.max(0, Math.ceil((petTimerEnd - Date.now()) / 1000));
      renderPetTimer();
      if (petTimerRemaining > 0) return;
      stopPetTimer();
      els.timerPet.classList.add("timer-done");
      toast("타이머가 끝났습니다.");
    }

    function stopPetTimer() {
      window.clearInterval(petTimerInterval);
      petTimerInterval = 0;
      els.timerPet.classList.remove("timer-running");
      els.petTimeInputs.forEach((input) => input.disabled = false);
      els.petTimerToggle.textContent = "START";
      els.petTimerToggle.setAttribute("aria-label", "타이머 시작");
      els.petTimerToggle.title = "시작";
    }

    function resetPetTimer() {
      stopPetTimer();
      petTimerRemaining = 0;
      els.timerPet.classList.remove("timer-done");
      renderPetTimer();
    }

    function renderPetTimer() {
      const hours = Math.floor(petTimerRemaining / 3600);
      const minutes = Math.floor((petTimerRemaining % 3600) / 60);
      const seconds = petTimerRemaining % 60;
      els.petTimerHours.value = String(hours).padStart(2, "0");
      els.petTimerMinutes.value = String(minutes).padStart(2, "0");
      els.petTimerSeconds.value = String(seconds).padStart(2, "0");
    }

    function syncSideSummary() {
      const wideLayout = window.matchMedia("(min-width: 1640px)").matches;
      if (!wideLayout) {
        document.body.classList.remove("side-summary-active");
        els.topbarSlot.style.height = "";
        return;
      }

      const sideActive = document.body.classList.contains("side-summary-active");
      if (!sideActive) {
        els.topbarSlot.style.height = `${els.topbar.offsetHeight}px`;
      }
      const activationPoint = els.topbarSlot.offsetTop + els.topbarSlot.offsetHeight;
      document.body.classList.toggle("side-summary-active", window.scrollY > activationPoint);
    }

    function addRecruitSlot(event) {
      const race = event.currentTarget.closest("[data-recruit-race]").dataset.recruitRace;
      recruitDraftSlots[race] += 1;
      renderRecruitment();
      const inputs = document.querySelectorAll(`[data-recruit-list="${race}"] .recruit-name-input`);
      inputs[inputs.length - 1]?.focus();
    }

    function render() {
      repairOrders();
      const ranked = rankedPlayers();
      renderSummary(ranked);
      renderRecruitment();
      renderTeamInputs();
      renderFunding(ranked);
      renderObserverCopy(ranked);
      if (rouletteMode === "loser") renderLoserRoulette();
    }

    function renderSummary(ranked) {
      const total = ranked.reduce((sum, player) => sum + player.funding, 0);
      const winnerOpen = state.winnersTarget > 0 && total >= state.winnersTarget;
      const winnerShortage = Math.max(0, state.winnersTarget - total);

      els.totalFunding.textContent = formatCount(total);
      els.matchSummary.textContent = `${state.matchSize}대${state.matchSize}`;
      els.memberSummary.textContent = `${state.players.length}명`;
      els.winnerSummary.textContent = winnerOpen ? "열림" : "닫힘";
      els.winnerRemaining.textContent = winnerOpen
        ? ""
        : !state.winnersTarget
          ? "목표 미설정"
          : `${formatCount(winnerShortage)} 남음`;
      els.winnerSummaryCard.classList.toggle("open", winnerOpen);
      els.winnerSummaryCard.classList.toggle("closed", !winnerOpen);
      els.winnerTarget.value = state.winnersTarget || "";
      els.matchButtons.forEach((button) => {
        button.classList.toggle("active", Number(button.dataset.match) === state.matchSize);
      });

      if (!state.winnersTarget) {
        els.winnerMessage.className = "winner-message";
        els.winnerMessage.textContent = "목표 개수를 입력해 주세요.";
      } else if (winnerOpen) {
        els.winnerMessage.className = "winner-message open";
        els.winnerMessage.textContent = `목표 달성, 위너스가 열렸습니다. (총 ${formatCount(total)})`;
      } else {
        els.winnerMessage.className = "winner-message";
        els.winnerMessage.textContent = `${formatCount(winnerShortage)} 남았습니다.`;
      }
    }

    function renderRecruitment() {
      els.recruitLists.forEach((list) => {
        const race = list.dataset.recruitList;
        const players = state.players.filter((player) => player.race === race && !player.team);
        list.innerHTML = "";
        players.forEach((player) => list.appendChild(createRecruitField(race, player)));
        for (let index = 0; index < recruitDraftSlots[race]; index += 1) {
          list.appendChild(createRecruitField(race));
        }
      });
    }

    function createRecruitField(race, player) {
      const field = document.createElement("span");
      field.className = "recruit-name-field";
      const input = document.createElement("input");
      input.className = "recruit-name-input";
      input.type = "text";
      input.maxLength = 10;
      input.autocomplete = "off";
      input.placeholder = `${races[race].label} 이름`;
      input.value = player?.name || "";
      input.dataset.race = race;
      input.dataset.id = player?.id || "";
      input.setAttribute("aria-label", `${races[race].label} 선수 이름`);
      input.addEventListener("keydown", (event) => {
        if (event.isComposing || event.keyCode === 229) return;
        if (event.key !== "Enter") return;
        event.preventDefault();
        event.currentTarget.blur();
      });
      input.addEventListener("change", handleRecruitCommit);
      field.appendChild(input);
      appendRecruitRemoveButton(field, player, race);
      return field;
    }

    function appendRecruitRemoveButton(field, player, race) {
      field.querySelector("button")?.remove();
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = "×";
      if (player) {
        button.dataset.action = "remove";
        button.dataset.id = player.id;
        button.setAttribute("aria-label", `${player.name} 삭제`);
        button.addEventListener("click", handleRemove);
      } else {
        button.dataset.action = "remove-draft";
        button.dataset.race = race;
        button.setAttribute("aria-label", "빈 입력칸 삭제");
        button.addEventListener("mousedown", handleDraftRemove);
      }
      field.appendChild(button);
    }

    function handleDraftRemove(event) {
      event.preventDefault();
      const race = event.currentTarget.dataset.race;
      recruitDraftSlots[race] = Math.max(0, recruitDraftSlots[race] - 1);
      event.currentTarget.closest(".recruit-name-field")?.remove();
    }

    function handleRecruitCommit(event) {
      const input = event.currentTarget;
      const race = input.dataset.race;
      const oldPlayer = findPlayer(input.dataset.id);
      const name = input.value.trim().slice(0, 10);

      if (!name) {
        if (oldPlayer) input.value = oldPlayer.name;
        return;
      }

      const duplicate = state.players.find((player) => player.id !== oldPlayer?.id && player.name === name);
      if (duplicate) {
        input.value = oldPlayer?.name || "";
        input.select();
        toast("같은 이름의 선수가 이미 있습니다.");
        return;
      }

      let player = oldPlayer;
      if (player) {
        player.name = name;
      } else {
        player = normalizePlayer({
          id: createId(),
          name,
          race,
          fundingOrder: nextFundingOrder()
        });
        state.players.push(player);
        recruitDraftSlots[race] = Math.max(0, recruitDraftSlots[race] - 1);
        input.dataset.id = player.id;
        appendRecruitRemoveButton(input.closest(".recruit-name-field"), player, race);
      }
      input.value = player.name;
      refreshAfterRecruitmentChange();
    }

    function refreshAfterRecruitmentChange() {
      repairOrders();
      const ranked = rankedPlayers();
      save();
      renderSummary(ranked);
      els.teamOneTitle.textContent = `${teamLabel("1")} 직접 입력`;
      els.teamTwoTitle.textContent = `${teamLabel("2")} 직접 입력`;
      document.querySelectorAll(".team-slot-input").forEach((input) => {
        const player = findPlayer(input.dataset.currentId);
        input.value = player?.team === input.dataset.team ? player.name : "";
        if (!player || player.team !== input.dataset.team) input.dataset.currentId = "";
      });
      renderFunding(ranked);
    }

    function renderTeamInputs() {
      renderTeam("1", els.teamOneTitle, els.teamOneInputs);
      renderTeam("2", els.teamTwoTitle, els.teamTwoInputs);
    }

    function renderTeam(team, title, container) {
      const players = teamPlayers(team);
      const slotCount = Math.max(state.matchSize, players.length);
      const slotPlayers = Array(slotCount).fill(null);
      players.forEach((player) => {
        const savedIndex = team === "1"
          ? orderValue(player.teamOrder) - 1
          : orderValue(player.teamOrder) - 101;
        const index = savedIndex >= 0 && savedIndex < slotCount && !slotPlayers[savedIndex]
          ? savedIndex
          : slotPlayers.findIndex((item) => !item);
        if (index >= 0) slotPlayers[index] = player;
      });
      title.textContent = `${teamLabel(team)} 직접 입력`;
      container.style.setProperty("--slot-count", slotCount);
      container.innerHTML = "";
      for (let index = 0; index < slotCount; index += 1) {
        const player = slotPlayers[index];
        const input = document.createElement("input");
        input.className = "team-slot-input";
        input.type = "text";
        input.maxLength = 10;
        input.autocomplete = "off";
        input.dataset.team = team;
        input.dataset.index = String(index);
        input.dataset.currentId = player?.id || "";
        input.value = player?.name || "";
        input.setAttribute("aria-label", `${team}팀 ${index + 1}번 선수`);
        input.addEventListener("keydown", (event) => {
          if (event.isComposing || event.keyCode === 229) return;
          if (event.key !== "Enter") return;
          event.preventDefault();
          event.currentTarget.blur();
        });
        input.addEventListener("change", handleTeamSlotCommit);
        container.appendChild(input);
      }
    }

    function renderFunding(ranked) {
      if (!ranked.length) {
        els.fundingList.innerHTML = `<div class="empty">선수를 등록하면 여기에 표시됩니다.</div>`;
        return;
      }
      const roles = buildRoleMap(ranked);
      els.fundingList.innerHTML = "";
      ranked.forEach((player, index) => {
        const row = document.createElement("div");
        const race = races[player.race] || races.U;
        const role = roles[player.id];
        const previous = ranked[index - 1];
        const next = ranked[index + 1];
        const canUp = previous && previous.funding === player.funding;
        const canDown = next && next.funding === player.funding;
        row.className = `funding-row ${index === 0 ? "first" : ""} ${role === "room" ? "room-row" : ""}`;
        row.dataset.playerId = player.id;
        row.innerHTML = `
          <span class="rank">${index + 1}</span>
          <strong class="player-name race-text ${race.className}">${escapeHtml(player.name)}</strong>
          <input class="funding-input" type="number" min="0" step="50" inputmode="numeric" value="${player.funding}" data-action="funding" data-id="${player.id}" aria-label="${escapeHtml(player.name)} 펀딩 개수">
          <span class="role ${role}">${roleLabel(role)}</span>
          <input class="memo-input" type="text" maxlength="30" value="${escapeHtml(player.memo)}" data-action="memo" data-id="${player.id}" aria-label="${escapeHtml(player.name)} 메모" placeholder="메모">
          <span class="tie-controls">
            <button type="button" data-action="tie-up" data-id="${player.id}" ${canUp ? "" : "disabled"} aria-label="${escapeHtml(player.name)} 동점 순위 올리기">↑</button>
            <button type="button" data-action="tie-down" data-id="${player.id}" ${canDown ? "" : "disabled"} aria-label="${escapeHtml(player.name)} 동점 순위 내리기">↓</button>
          </span>
        `;
        const fundingInput = row.querySelector('[data-action="funding"]');
        fundingInput.addEventListener("keydown", (event) => {
          if (event.key !== "Enter") return;
          event.preventDefault();
          event.currentTarget.blur();
        });
        fundingInput.addEventListener("blur", handleFundingCommit);
        row.querySelector('[data-action="memo"]').addEventListener("input", handleMemoInput);
        row.querySelectorAll('[data-action^="tie-"]').forEach((button) => button.addEventListener("click", handleTieMove));
        els.fundingList.appendChild(row);
        if (index === 3 && ranked.length > 4) {
          const divider = document.createElement("div");
          divider.className = "spectator-divider";
          divider.textContent = "4등까지 옵저버";
          els.fundingList.appendChild(divider);
        }
      });
    }

    function handleTeamSlotCommit(event) {
      const input = event.currentTarget;
      const team = input.dataset.team;
      const index = Number(input.dataset.index);
      const oldPlayer = findPlayer(input.dataset.currentId);
      const name = input.value.trim().slice(0, 10);

      if (!name) {
        if (oldPlayer) {
          oldPlayer.team = "";
          oldPlayer.teamOrder = 0;
        }
        saveAndRender();
        return;
      }

      const player = state.players.find((item) => item.name === name);
      if (!player) {
        input.value = oldPlayer?.name || "";
        input.select();
        toast("먼저 위 T/Z/P 모집에 선수를 등록해 주세요.");
        return;
      }

      if (oldPlayer && oldPlayer.id !== player.id) {
        oldPlayer.team = "";
        oldPlayer.teamOrder = 0;
      }
      player.team = team;
      player.teamOrder = team === "1" ? index + 1 : 100 + index + 1;
      recruitDraftSlots.T = 0;
      recruitDraftSlots.Z = 0;
      recruitDraftSlots.P = 0;
      saveAndRender();
    }

    function handleRemove(event) {
      const player = findPlayer(event.currentTarget.dataset.id);
      if (!player || !window.confirm(`${player.name} 선수를 삭제할까요?`)) return;
      state.players = state.players.filter((item) => item.id !== player.id);
      saveAndRender();
    }

    function handleFundingCommit(event) {
      const player = findPlayer(event.currentTarget.dataset.id);
      if (!player) return;
      player.funding = numberValue(event.currentTarget.value);
      if (!player.fundingOrder) player.fundingOrder = nextFundingOrder();
      player.roleOrder = 0;
      saveAndRender();
    }

    function handleMemoInput(event) {
      const player = findPlayer(event.currentTarget.dataset.id);
      if (!player) return;
      player.memo = event.currentTarget.value.slice(0, 30);
      save();
    }

    function handleTieMove(event) {
      const direction = event.currentTarget.dataset.action === "tie-up" ? -1 : 1;
      moveTiedPlayer(event.currentTarget.dataset.id, direction);
    }

    function moveTiedPlayer(playerId, direction) {
      const ranked = rankedPlayers();
      const index = ranked.findIndex((player) => player.id === playerId);
      const targetIndex = index + direction;
      if (index < 0 || targetIndex < 0 || targetIndex >= ranked.length) return;
      if (ranked[index].funding !== ranked[targetIndex].funding) return;
      const tied = ranked.filter((player) => player.funding === ranked[index].funding);
      const currentTiedIndex = tied.findIndex((player) => player.id === playerId);
      const targetTiedIndex = currentTiedIndex + direction;
      if (targetTiedIndex < 0 || targetTiedIndex >= tied.length) return;
      [tied[currentTiedIndex], tied[targetTiedIndex]] = [tied[targetTiedIndex], tied[currentTiedIndex]];
      tied.forEach((player, tiedIndex) => {
        player.roleOrder = tiedIndex + 1;
      });
      save();
      render();
      window.requestAnimationFrame(() => {
        const movedRow = Array.from(els.fundingList.querySelectorAll(".funding-row"))
          .find((row) => row.dataset.playerId === playerId);
        movedRow?.classList.add(direction < 0 ? "tie-moved-up" : "tie-moved-down");
      });
      toast(direction < 0 ? "동점 순위를 위로 옮겼습니다." : "동점 순위를 아래로 옮겼습니다.");
    }

    function rankedPlayers() {
      return [...state.players].sort((a, b) => {
        if (b.funding !== a.funding) return b.funding - a.funding;
        const roleA = orderValue(a.roleOrder) || Number.MAX_SAFE_INTEGER;
        const roleB = orderValue(b.roleOrder) || Number.MAX_SAFE_INTEGER;
        if (roleA !== roleB) return roleA - roleB;
        return fundingOrderValue(a) - fundingOrderValue(b);
      });
    }

    function buildRoleMap(ranked) {
      const roles = {};
      ranked.forEach((player, index) => {
        roles[player.id] = index === ranked.length - 1 ? "room" : index < 4 ? "spectator" : "player";
      });
      return roles;
    }

    function buildObserverOrderText(ranked) {
      const roles = buildRoleMap(ranked);
      const observers = ranked.filter((player) => roles[player.id] === "spectator");
      const others = ranked.filter((player) => roles[player.id] !== "spectator");
      const visibleObservers = observers.slice(0, 6);
      const visibleOthers = others.slice(0, Math.max(6 - visibleObservers.length, 0));

      if (!visibleObservers.length && !visibleOthers.length) return "옵저버 순위를 복사해주세요.";

      const observerNames = visibleObservers.map((player) => player.name).join(" ");
      const otherNames = visibleOthers.map((player) => player.name).join(" ");
      if (observerNames && otherNames) return `${observerNames} // ${otherNames}`;
      return observerNames || otherNames;
    }

    function renderObserverCopy(ranked = rankedPlayers()) {
      els.observerCopyText.value = buildObserverOrderText(ranked);
    }

    async function copyObserverOrder() {
      const text = els.observerCopyText.value;
      try {
        await navigator.clipboard.writeText(text);
      } catch {
        els.observerCopyText.focus();
        els.observerCopyText.select();
        document.execCommand("copy");
        els.observerCopyText.setSelectionRange(0, 0);
      }
      toast("옵저버 순서를 복사했습니다.");
    }

    function roleLabel(role) {
      if (role === "spectator") return "옵저버";
      if (role === "room") return "룸싸개";
      return "";
    }

    function teamPlayers(team) {
      return state.players
        .filter((player) => player.team === team)
        .sort((a, b) => orderValue(a.teamOrder) - orderValue(b.teamOrder));
    }

    function teamLabel(team) {
      const first = teamPlayers(team)[0];
      return first ? `${first.name}팀` : `${team}팀`;
    }

    function repairOrders() {
      let nextFunding = nextFundingOrder();
      let nextTeam = nextTeamOrder();
      state.players.forEach((player) => {
        if (!player.fundingOrder) {
          player.fundingOrder = nextFunding;
          nextFunding += 1;
        }
        if (player.team && !player.teamOrder) {
          player.teamOrder = nextTeam;
          nextTeam += 1;
        }
      });
    }

    function nextFundingOrder() {
      return Math.max(0, ...state.players.map((player) => orderValue(player.fundingOrder))) + 1;
    }

    function nextTeamOrder() {
      return Math.max(0, ...state.players.map((player) => orderValue(player.teamOrder))) + 1;
    }

    function fundingOrderValue(player) {
      return orderValue(player.fundingOrder) || state.players.indexOf(player) + 1;
    }

    function findPlayer(id) {
      return state.players.find((player) => player.id === id);
    }

    function numberValue(value) {
      const number = Number(String(value ?? "").replace(/[^0-9]/g, ""));
      return Number.isFinite(number) && number > 0 ? Math.floor(number) : 0;
    }

    function orderValue(value) {
      const number = Number(value);
      return Number.isFinite(number) && number > 0 ? Math.floor(number) : 0;
    }

    function formatCount(value) {
      return `${numberValue(value).toLocaleString("ko-KR")}개`;
    }

    function createId() {
      return `p-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
    }

    function saveAndRender() {
      save();
      render();
    }

    function resetBoard() {
      if (!window.confirm("선수와 펀딩 내용을 전부 초기화할까요?")) return;
      state = createDefaultState();
      recruitDraftSlots.T = 1;
      recruitDraftSlots.Z = 1;
      recruitDraftSlots.P = 1;
      saveAndRender();
      toast("전체 내용을 초기화했습니다.");
    }

    function toast(message) {
      window.clearTimeout(toastTimer);
      els.toast.textContent = message;
      els.toast.classList.add("show");
      toastTimer = window.setTimeout(() => els.toast.classList.remove("show"), 1800);
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>
</body>
</html>
