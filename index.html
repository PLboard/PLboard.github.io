<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>피엘보드 - 버전 선택</title>
  <style>
    :root {
      --paper: #fff9e8;
      --ink: #111111;
      --blue: #63b2e8;
      --green: #73df57;
      --orange: #ff9a49;
      --purple: #bd88d4;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: var(--paper);
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      letter-spacing: 0;
    }

    main {
      width: min(1220px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding: clamp(34px, 6vw, 76px) 24px 44px;
    }

    header {
      margin-bottom: clamp(46px, 8vw, 96px);
    }

    .labels {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 32px;
    }

    .label {
      min-width: 190px;
      padding: 8px 14px;
      border: 3px solid var(--ink);
      border-radius: 5px;
      box-shadow: 4px 4px 0 var(--ink);
      font-family: "Courier New", monospace;
      font-size: 17px;
      font-weight: 900;
      text-align: center;
    }

    .label:first-child {
      background: var(--orange);
    }

    .label:last-child {
      background: var(--green);
    }

    h1 {
      max-width: 980px;
      margin: 0;
      font-size: clamp(38px, 5vw, 66px);
      line-height: 1.15;
      font-weight: 900;
    }

    .mode-frame {
      padding: 26px;
      border: 4px solid var(--ink);
      border-radius: 8px;
      background: #fff5c9;
    }

    .mode-list {
      display: grid;
      gap: 38px;
    }

    .mode {
      display: grid;
      grid-template-columns: 132px minmax(210px, 0.65fr) 1px minmax(360px, 1.35fr) 54px;
      gap: 24px;
      align-items: center;
      min-height: 142px;
      padding: 24px 28px;
      color: var(--ink);
      border: 4px solid var(--ink);
      border-radius: 7px;
      box-shadow: 7px 8px 0 var(--ink);
      text-decoration: none;
      transition: transform 130ms ease, box-shadow 130ms ease;
    }

    .mode.general {
      background: var(--blue);
    }

    .mode.easy {
      background: var(--green);
    }

    .mode.personal {
      width: 100%;
      font: inherit;
      text-align: left;
      background: var(--purple);
    }

    .mode:hover,
    .mode:focus-visible {
      outline: none;
      box-shadow: 10px 11px 0 var(--ink);
      transform: translate(-3px, -3px);
    }

    .mode-code {
      display: grid;
      place-items: center;
      min-height: 56px;
      padding: 8px 10px;
      background: var(--white);
      border: 3px solid var(--ink);
      border-radius: 5px;
      box-shadow: 3px 3px 0 var(--ink);
      font-family: "Courier New", monospace;
      font-size: 16px;
      font-weight: 900;
      text-align: center;
    }

    .mode-title small {
      display: block;
      margin-bottom: 5px;
      font-family: "Courier New", monospace;
      font-size: 15px;
      font-weight: 900;
    }

    .mode-title h2 {
      margin: 0;
      font-family: "Courier New", "Malgun Gothic", monospace;
      font-size: clamp(28px, 3vw, 40px);
      line-height: 1.08;
    }

    .divider {
      width: 1px;
      height: 60px;
      border-left: 3px dashed rgba(17, 17, 17, 0.45);
    }

    .mode-copy {
      margin: 0;
      font-size: clamp(17px, 1.7vw, 21px);
      line-height: 1.45;
      font-weight: 800;
      word-break: keep-all;
      overflow-wrap: normal;
    }

    .open-icon {
      display: grid;
      place-items: center;
      width: 52px;
      height: 52px;
      background: var(--white);
      border: 3px solid var(--ink);
      border-radius: 5px;
      font-family: "Courier New", monospace;
      font-size: 29px;
      font-weight: 900;
      line-height: 1;
    }

    dialog {
      width: min(460px, calc(100% - 32px));
      padding: 28px;
      color: var(--ink);
      background: var(--paper);
      border: 4px solid var(--ink);
      border-radius: 7px;
      box-shadow: 9px 10px 0 var(--ink);
    }

    dialog::backdrop {
      background: rgba(17, 17, 17, 0.46);
    }

    dialog h2 {
      margin: 0 0 12px;
      font-family: "Courier New", "Malgun Gothic", monospace;
      font-size: 32px;
    }

    dialog p {
      margin: 0 0 24px;
      font-size: 20px;
      font-weight: 800;
    }

    .dialog-close {
      width: 100%;
      min-height: 50px;
      color: var(--ink);
      background: var(--purple);
      border: 3px solid var(--ink);
      border-radius: 5px;
      box-shadow: 4px 4px 0 var(--ink);
      font: inherit;
      font-size: 19px;
      font-weight: 900;
      cursor: pointer;
    }

    .dialog-close:active {
      box-shadow: 1px 1px 0 var(--ink);
      transform: translate(3px, 3px);
    }

    @media (max-width: 1200px) {
      header {
        margin-bottom: 44px;
      }

      .mode-frame {
        padding: 18px;
      }

      .mode {
        grid-template-columns: 110px minmax(0, 1fr) 46px;
        gap: 18px;
        padding: 22px;
      }

      .divider {
        display: none;
      }

      .mode-copy {
        grid-column: 2 / -1;
      }

      .open-icon {
        grid-column: 3;
        grid-row: 1;
        width: 46px;
        height: 46px;
      }
    }

    @media (max-width: 560px) {
      main {
        padding: 28px 14px 36px;
      }

      .labels {
        gap: 9px;
      }

      .label {
        min-width: 0;
        flex: 1 1 150px;
        font-size: 14px;
      }

      .mode-frame {
        padding: 12px;
      }

      .mode-list {
        gap: 28px;
      }

      .mode {
        grid-template-columns: 86px minmax(0, 1fr);
        gap: 15px;
        min-height: 0;
        padding: 18px;
        box-shadow: 5px 6px 0 var(--ink);
      }

      .mode-code {
        min-height: 48px;
        font-size: 13px;
      }

      .mode-title h2 {
        font-size: 27px;
      }

      .mode-copy {
        grid-column: 1 / -1;
        font-size: 17px;
      }

      .open-icon {
        display: none;
      }

    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="labels" aria-hidden="true">
        <span class="label">PL BOARD SYSTEM</span>
        <span class="label">SELECT WORKFLOW</span>
      </div>
      <h1>피엘보드 모드를 선택하세요.</h1>
    </header>

    <section class="mode-frame" aria-label="피엘보드 버전 선택">
      <div class="mode-list">
        <a class="mode easy" href="./easy/index.html">
          <span class="mode-code">MODE 01</span>
          <span class="mode-title">
            <small>DIRECT WORKFLOW</small>
            <h2>아재버전</h2>
          </span>
          <span class="divider" aria-hidden="true"></span>
          <p class="mode-copy">큰 글씨와 직접 입력 방식으로 빠르게 진행하는<br>단순 피엘보드</p>
          <span class="open-icon" aria-hidden="true">→</span>
        </a>

        <a class="mode general" href="./general/index.html">
          <span class="mode-code">MODE 02</span>
          <span class="mode-title">
            <small>FULL WORKFLOW</small>
            <h2>일반버전</h2>
          </span>
          <span class="divider" aria-hidden="true"></span>
          <p class="mode-copy">드래그 팀 구성과 전체 관리 기능을 사용하는<br>기본 피엘보드</p>
          <span class="open-icon" aria-hidden="true">→</span>
        </a>

        <button class="mode personal" id="personalModeButton" type="button">
          <span class="mode-code">MODE 03</span>
          <span class="mode-title">
            <small>PERSONAL WORKFLOW</small>
            <h2>개인버전</h2>
          </span>
          <span class="divider" aria-hidden="true"></span>
          <p class="mode-copy">개인용 피엘보드는 오픈 준비중입니다.</p>
          <span class="open-icon" aria-hidden="true">…</span>
        </button>
      </div>
    </section>
  </main>

  <dialog id="personalDialog" aria-labelledby="personalDialogTitle">
    <h2 id="personalDialogTitle">개인버전</h2>
    <p>개인용 피엘보드는 현재 오픈 준비중입니다.</p>
    <button class="dialog-close" id="personalDialogClose" type="button">확인</button>
  </dialog>

  <script>
    const personalModeButton = document.getElementById("personalModeButton");
    const personalDialog = document.getElementById("personalDialog");
    const personalDialogClose = document.getElementById("personalDialogClose");

    personalModeButton.addEventListener("click", () => personalDialog.showModal());
    personalDialogClose.addEventListener("click", () => personalDialog.close());
    personalDialog.addEventListener("click", (event) => {
      if (event.target === personalDialog) personalDialog.close();
    });
  </script>
</body>
</html>
